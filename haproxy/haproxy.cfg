global
    maxconn 50000
    log stdout format raw local0 info

defaults
    # HTTP mode lets HAProxy parse the request line and inject headers.
    # CONNECT tunnels are handled transparently: after the backend replies
    # 200, HAProxy switches both sides to raw TCP tunnel mode automatically.
    mode http
    log global
    option httplog
    option forwardfor        # inject X-Forwarded-For: <real-client-ip> on every request
    timeout connect 5s
    timeout client 120s
    timeout server 120s
    retries 3

# Use Docker's embedded DNS to discover all proxy replicas dynamically.
resolvers docker_dns
    nameserver dns 127.0.0.11:53
    hold valid 10s
    hold nx 30s
    resolve_retries 3

# Receives MITM proxy traffic from clients configured to use this host
# as an HTTP/HTTPS proxy (port 8080) or HTTPS proxy alias (port 443).
# Both ports carry plain HTTP from the client — even for HTTPS targets,
# the client sends a CONNECT request first (HTTP proxy protocol).
frontend mitm_proxy_frontend
    bind *:8080
    bind *:443
    default_backend mitm_proxy_backends

# All proxy replicas, sticky by source IP.
# balance source hashes the client IP so the same user always lands on
# the same replica (preserving in-memory upload/session state).
backend mitm_proxy_backends
    balance source
    server-template proxy- 10 proxy:8080 check resolvers docker_dns resolve-prefer ipv4 init-addr none
