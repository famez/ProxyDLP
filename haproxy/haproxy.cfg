global
    maxconn 50000
    log stdout format raw local0 info

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client 120s
    timeout server 120s
    retries 3

# Use Docker's embedded DNS to discover all proxy replicas dynamically.
# When replicas are added or removed, HAProxy re-resolves within hold valid time.
resolvers docker_dns
    nameserver dns 127.0.0.11:53
    hold valid 10s
    hold nx 30s
    resolve_retries 3

# -------------------------------------------------------
# MITM Proxy frontend — receives traffic from clients
# configured to use this host as an HTTP/HTTPS proxy.
# -------------------------------------------------------
frontend mitm_proxy_frontend
    bind *:8080
    bind *:443
    default_backend mitm_proxy_backends

# -------------------------------------------------------
# Backend — all proxy replicas, sticky by source IP.
# server-template creates up to 10 slots; Docker DNS fills
# them with actual replica IPs.  `balance source` hashes
# the client IP so the same user always lands on the same
# replica (preserving in-memory upload/session state).
# -------------------------------------------------------
backend mitm_proxy_backends
    balance source
    server-template proxy- 10 proxy:8080 check \
        resolvers docker_dns resolve-prefer ipv4 init-addr none
